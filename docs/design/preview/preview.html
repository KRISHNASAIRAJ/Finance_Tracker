<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meridian - Sleep Block Live Preview</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; background: #101014; color: #e8e8ea;
    font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 16px;
  }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: .03em; margin: 4px 0 0; color: #bbb; }
  h1 b { color: #fff; }
  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
         background: #1a1a20; border: 1px solid #26262e; border-radius: 10px; padding: 8px 12px; }
  .bar label { display: flex; align-items: center; gap: 5px; color: #aaa; user-select: none; }
  select, button { background: #26262e; color: #e8e8ea; border: 1px solid #34343e; border-radius: 7px; padding: 4px 8px; font: inherit; cursor: pointer; }
  button:hover { background: #2f2f38; }
  .status { display: flex; align-items: center; gap: 6px; color: #9f9; font-size: 12px; min-width: 120px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #2fbf4f; box-shadow: 0 0 6px #2fbf4f88; }
  .status.err { color: #ff7a7a; }
  .status.err .dot { background: #ff5252; box-shadow: 0 0 6px #ff525288; }
  .wrap { background: #000; border-radius: 26px; padding: 22px; border: 1px solid #2a2a30; }
  canvas { display: block; }
  #err { background: #3a1414; border: 1px solid #6b2626; color: #ffb3b3; border-radius: 8px;
         padding: 8px 12px; max-width: 900px; white-space: pre-wrap; display: none; }
  .hint { color: #777; font-size: 11px; }
  code { background: #22222a; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>Sleep block <b>- live preview</b></h1>
  <div class="bar">
    <span class="status" id="status"><span class="dot"></span><span id="statusText">live</span></span>
    <label>Zoom <select id="zoom">
      <option value="2">2x</option><option value="3">3x</option>
      <option value="4" selected>4x</option><option value="6">6x</option>
    </select></label>
    <label><input type="checkbox" id="guides" /> guides</label>
    <button id="reload">reload now</button>
    <a href="widget.html" style="color:#7ab8ff;text-decoration:none">full widget preview &rarr;</a>
    <span class="hint">edit <code>geometry.json</code> and save - re-renders automatically</span>
  </div>
  <div id="err"></div>
  <div class="wrap"><canvas id="cv" width="1168" height="528"></canvas></div>
  <div class="hint" id="meta">loaded -</div>

<script src="sleep-block.js"></script>
<script>
'use strict';
const JSON_URL = 'geometry.json';
const POLL_MS = 600;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
const errEl = document.getElementById('err');
const metaEl = document.getElementById('meta');
const zoomSel = document.getElementById('zoom');
const guidesChk = document.getElementById('guides');
const reloadBtn = document.getElementById('reload');

let lastRaw = null;
let lastGeom = null;
let lastLoad = null;

function setStatus(ok, msg) {
  statusEl.classList.toggle('err', !ok);
  statusText.textContent = msg;
}
function showError(msg) {
  errEl.textContent = msg;
  errEl.style.display = msg ? 'block' : 'none';
}

function render(g) {
  const W = g.canvas.w, H = g.canvas.h;
  const zoom = parseInt(zoomSel.value, 10);
  cv.width = Math.round(W * zoom);
  cv.height = Math.round(H * zoom);
  ctx.setTransform(zoom, 0, 0, zoom, 0, 0);
  SleepBlock.render(ctx, g, { guides: guidesChk.checked });
}

async function poll() {
  let raw = null;
  try {
    const res = await fetch(JSON_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' fetching ' + JSON_URL);
    raw = await res.text();
  } catch (e) {
    setStatus(false, 'offline');
    showError('Could not fetch ' + JSON_URL + '\n' + e.message +
              '\n(Is the static server still running? If JSON is mid-edit and invalid, the last good frame stays on screen.)');
    return;
  }
  if (raw === lastRaw && lastGeom) { setStatus(true, 'live (no changes)'); return; }
  try {
    const g = JSON.parse(raw);
    lastGeom = g; lastRaw = raw; lastLoad = new Date();
    showError(null);
    setStatus(true, 'live');
    metaEl.textContent = 'rendered ' + lastLoad.toLocaleTimeString() + ' - canvas ' + g.canvas.w + 'x' + g.canvas.h;
    render(g);
  } catch (e) {
    setStatus(false, 'bad JSON');
    showError('geometry.json is not valid JSON - last good frame is still shown.\n' + e.message);
  }
}

reloadBtn.addEventListener('click', () => { lastRaw = null; poll(); });
zoomSel.addEventListener('change', () => lastGeom && render(lastGeom));
guidesChk.addEventListener('change', () => lastGeom && render(lastGeom));
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
