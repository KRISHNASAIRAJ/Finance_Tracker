<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meridian — Sleep Block Live Preview</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; background: #101014; color: #e8e8ea;
    font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 16px;
  }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: .03em; margin: 4px 0 0; color: #bbb; }
  h1 b { color: #fff; }
  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
         background: #1a1a20; border: 1px solid #26262e; border-radius: 10px; padding: 8px 12px; }
  .bar label { display: flex; align-items: center; gap: 5px; color: #aaa; user-select: none; }
  select, button { background: #26262e; color: #e8e8ea; border: 1px solid #34343e; border-radius: 7px; padding: 4px 8px; font: inherit; cursor: pointer; }
  button:hover { background: #2f2f38; }
  .status { display: flex; align-items: center; gap: 6px; color: #9f9; font-size: 12px; min-width: 120px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #2fbf4f; box-shadow: 0 0 6px #2fbf4f88; }
  .status.err { color: #ff7a7a; }
  .status.err .dot { background: #ff5252; box-shadow: 0 0 6px #ff525288; }
  .wrap { background: #000; border-radius: 26px; padding: 22px; border: 1px solid #2a2a30; }
  canvas { display: block; }
  #err { background: #3a1414; border: 1px solid #6b2626; color: #ffb3b3; border-radius: 8px;
         padding: 8px 12px; max-width: 900px; white-space: pre-wrap; display: none; }
  .hint { color: #777; font-size: 11px; }
  code { background: #22222a; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>Sleep block <b>— live preview</b></h1>
  <div class="bar">
    <span class="status" id="status"><span class="dot"></span><span id="statusText">live</span></span>
    <label>Zoom <select id="zoom">
      <option value="2">2x</option><option value="3">3x</option>
      <option value="4" selected>4x</option><option value="6">6x</option>
    </select></label>
    <label><input type="checkbox" id="guides" /> guides</label>
    <button id="reload">reload now</button>
    <span class="hint">edit <code>geometry.json</code> and save — re-renders automatically</span>
  </div>
  <div id="err"></div>
  <div class="wrap"><canvas id="cv" width="1168" height="528"></canvas></div>
  <div class="hint" id="meta">loaded —</div>

<script>
'use strict';
const JSON_URL = 'geometry.json';
const POLL_MS = 600;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
const errEl = document.getElementById('err');
const metaEl = document.getElementById('meta');
const zoomSel = document.getElementById('zoom');
const guidesChk = document.getElementById('guides');
const reloadBtn = document.getElementById('reload');

let lastRaw = null;   // raw JSON text of the currently rendered frame
let lastGeom = null;  // last successfully parsed geometry
let zoom = 4;
let lastLoad = null;

function setStatus(ok, msg) {
  statusEl.classList.toggle('err', !ok);
  statusText.textContent = msg;
}
function showError(msg) {
  errEl.textContent = msg;
  errEl.style.display = msg ? 'block' : 'none';
}

function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function fmt(n) { return Math.round(n * 100) / 100; }

function render(g) {
  const W = g.canvas.w, H = g.canvas.h;
  zoom = parseInt(zoomSel.value, 10);
  cv.width = Math.round(W * zoom);
  cv.height = Math.round(H * zoom);
  ctx.scale(zoom, zoom);
  ctx.clearRect(0, 0, W, H);

  // 1. silhouette (same path as SleepBlockRenderer.kt)
  const s = g.silhouette;
  ctx.fillStyle = g.colors.red;
  ctx.beginPath();
  ctx.moveTo(0, s.moveTo);
  ctx.quadraticCurveTo(s.tlQuad[0], s.tlQuad[1], s.tlQuad[2], s.tlQuad[3]);
  ctx.lineTo(s.approachX, s.bodyTopY);
  ctx.quadraticCurveTo(s.filletQuad[0], s.filletQuad[1], s.filletQuad[2], s.filletQuad[3]);
  ctx.quadraticCurveTo(s.tabRootQuad[0], s.tabRootQuad[1], s.tabRootQuad[2], s.tabRootQuad[3]);
  ctx.lineTo(s.tabRightLineEndX, 0);
  ctx.quadraticCurveTo(s.rightQuad[0], s.rightQuad[1], s.rightQuad[2], s.rightQuad[3]);
  ctx.lineTo(s.rightQuad[2], s.rightBottomLineEndY);
  ctx.quadraticCurveTo(s.bottomRightQuad[0], s.bottomRightQuad[1], s.bottomRightQuad[2], s.bottomRightQuad[3]);
  ctx.lineTo(s.bottomLeftLineEndX, H);
  ctx.quadraticCurveTo(s.bottomLeftQuad[0], s.bottomLeftQuad[1], s.bottomLeftQuad[2], s.bottomLeftQuad[3]);
  ctx.closePath();
  ctx.fill();

  // letter-spacing helper (em * size, in design units ≈ px here)
  const ls = (em, size) => { try { ctx.letterSpacing = fmt(em * size) + 'px'; } catch (_) {} };
  const font = (weight, size) => { ctx.font = weight + ' ' + size + 'px "Segoe UI", Roboto, sans-serif'; };

  // 2. texts
  const t = g.texts;
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = t.sleep.color;
  font(t.sleep.weight, t.sleep.size); ls(t.sleep.spacing, t.sleep.size);
  ctx.fillText('SLEEP', t.sleep.x, t.sleep.baseline);
  ctx.fillStyle = t.duration.color;
  font(t.duration.weight, t.duration.size); ls(t.duration.spacing, t.duration.size);
  ctx.fillText(g.sampleNight.duration, t.duration.x, t.duration.baseline);
  ctx.fillStyle = t.score.color;
  font(t.score.weight, t.score.size); ls(t.score.spacing, t.score.size);
  ctx.fillText('Score ' + g.sampleNight.score, t.score.x, t.score.baseline);
  ls(0, 0); try { ctx.letterSpacing = '0px'; } catch (_) {}

  // score track: black track + fill = score percent
  const st = t.scoreTrack;
  ctx.fillStyle = 'rgba(0,0,0,' + st.trackAlpha + ')';
  rr(ctx, st.x0, st.y, st.x1 - st.x0, st.h, st.radius); ctx.fill();
  ctx.fillStyle = t.duration.color;
  const fillW = (st.x1 - st.x0) * Math.max(0, Math.min(100, g.sampleNight.score)) / 100;
  if (fillW > 0) { rr(ctx, st.x0, st.y, fillW, st.h, st.radius); ctx.fill(); }

  // 3. lane labels
  ctx.fillStyle = t.labels.color;
  font(t.labels.weight, t.labels.size); ls(t.labels.spacing, t.labels.size);
  ['DEEP', 'LIGHT', 'AWAKE'].forEach((name, i) => {
    ctx.fillText(name, t.labels.x, t.labels.baselines[i]);
  });
  ls(0, 0); try { ctx.letterSpacing = '0px'; } catch (_) {}

  const L = g.lanes;
  const barY = i => L.rowTops[i];

  // 4. tracks (always visible)
  ctx.fillStyle = 'rgba(0,0,0,' + L.trackAlpha + ')';
  L.rowTops.forEach(y => { rr(ctx, L.trackX, y, L.trackWidth, L.barHeight, L.radius); ctx.fill(); });

  // 5. dotted awake line
  ctx.strokeStyle = 'rgba(0,0,0,' + L.dotColorAlpha + ')';
  ctx.lineWidth = L.dotStroke;
  ctx.lineCap = 'round';
  ctx.setLineDash([0.1, L.dotPeriod]);
  ctx.beginPath();
  ctx.moveTo(L.dotX0, L.dotY);
  ctx.lineTo(L.dotX1, L.dotY);
  ctx.stroke();
  ctx.setLineDash([]);

  // 6. bars
  const drawBars = (i, segs, color) => {
    ctx.fillStyle = color;
    for (const seg of segs) {
      const a = Math.max(0, Math.min(100, seg[0]));
      const b = Math.max(0, Math.min(100, seg[1]));
      if (b <= a) continue;
      const x0 = L.trackX + a / 100 * L.trackWidth;
      const x1 = Math.min(L.trackX + L.trackWidth, Math.max(x0 + L.minBar, L.trackX + b / 100 * L.trackWidth));
      rr(ctx, x0, barY(i), x1 - x0, L.barHeight, L.radius);
      ctx.fill();
    }
  };
  drawBars(0, g.sampleNight.deep, g.colors.deep);
  drawBars(1, g.sampleNight.light, g.colors.light);
  drawBars(2, g.sampleNight.awake, g.colors.awake);

  // 7. bed / wake times
  ctx.fillStyle = t.times.color;
  font(400, t.times.size);
  ctx.textAlign = 'left';
  ctx.fillText(g.sampleNight.bed, t.times.bedX, t.times.baseline);
  ctx.textAlign = 'right';
  ctx.fillText(g.sampleNight.wake, t.times.wakeRightX, t.times.baseline);
  ctx.textAlign = 'left';

  // 8. guides
  if (guidesChk.checked) {
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.55)';
    ctx.fillStyle = 'rgba(0, 255, 255, 0.85)';
    ctx.lineWidth = 0.4;
    ctx.setLineDash([3, 3]);
    font(400, 4);
    const yGuides = [0, s.bodyTopY, L.rowTops[0], L.rowTops[1], L.rowTops[2],
                     L.dotY, t.labels.baselines[0], t.labels.baselines[1], t.labels.baselines[2],
                     t.times.baseline, H];
    for (const y of yGuides) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      ctx.fillText('y=' + y, 1, y - 0.8);
    }
    const xGuides = [0, s.approachX, s.filletQuad[0], s.tabRootQuad[2],
                     L.trackX, st.x0, st.x1, L.trackX + L.trackWidth, W];
    for (const x of xGuides) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      ctx.fillText('x=' + x, x + 0.8, 6);
    }
    ctx.setLineDash([]);
  }
}

async function poll() {
  let raw = null;
  try {
    const res = await fetch(JSON_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' fetching ' + JSON_URL);
    raw = await res.text();
  } catch (e) {
    setStatus(false, 'offline');
    showError('Could not fetch ' + JSON_URL + '\n' + e.message +
              '\n(Is the static server still running? If JSON is mid-edit and invalid, the last good frame stays on screen.)');
    return;
  }
  if (raw === lastRaw && lastGeom) { setStatus(true, 'live (no changes)'); return; }
  try {
    const g = JSON.parse(raw);
    lastGeom = g; lastRaw = raw; lastLoad = new Date();
    showError(null);
    setStatus(true, 'live');
    metaEl.textContent = 'rendered ' + lastLoad.toLocaleTimeString() + ' — canvas ' + g.canvas.w + 'x' + g.canvas.h;
    render(g);
  } catch (e) {
    setStatus(false, 'bad JSON');
    showError('geometry.json is not valid JSON — last good frame is still shown.\n' + e.message);
  }
}

reloadBtn.addEventListener('click', () => { lastRaw = null; poll(); });
zoomSel.addEventListener('change', () => lastGeom && render(lastGeom));
guidesChk.addEventListener('change', () => lastGeom && render(lastGeom));
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
