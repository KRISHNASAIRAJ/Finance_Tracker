<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meridian - Full Widget Live Preview</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; color: #e8e8ea;
    font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 16px;
    background: radial-gradient(1200px 800px at 30% 20%, #1d3a3a 0%, #12262b 45%, #0d1a20 100%);
  }
  body.plain { background: #101014; }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: .03em; margin: 4px 0 0; color: #9fc4c4; }
  h1 b { color: #fff; }
  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
         background: #1a1a20d9; border: 1px solid #2c2c34; border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(6px); }
  .bar label { display: flex; align-items: center; gap: 5px; color: #aaa; user-select: none; }
  select, button { background: #26262e; color: #e8e8ea; border: 1px solid #34343e; border-radius: 7px; padding: 4px 8px; font: inherit; cursor: pointer; }
  button:hover { background: #2f2f38; }
  .status { display: flex; align-items: center; gap: 6px; color: #9f9; font-size: 12px; min-width: 130px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #2fbf4f; box-shadow: 0 0 6px #2fbf4f88; }
  .status.err { color: #ff7a7a; }
  .status.err .dot { background: #ff5252; box-shadow: 0 0 6px #ff525288; }
  canvas { display: block; }
  #err { background: #3a1414; border: 1px solid #6b2626; color: #ffb3b3; border-radius: 8px;
         padding: 8px 12px; max-width: 900px; white-space: pre-wrap; display: none; }
  .hint { color: #6f8f8f; font-size: 11px; }
  code { background: #22222a; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>Full 2x2 widget <b>- live preview</b></h1>
  <div class="bar">
    <span class="status" id="status"><span class="dot"></span><span id="statusText">live</span></span>
    <label>Zoom <select id="zoom">
      <option value="1.5">1.5x</option><option value="2" selected>2x</option>
      <option value="3">3x</option><option value="4">4x</option>
    </select></label>
    <label><input type="checkbox" id="guides" /> block guides</label>
    <label><input type="checkbox" id="plain" /> plain backdrop</label>
    <button id="reload">reload now</button>
    <a href="preview.html" style="color:#7ab8ff;text-decoration:none">&larr; block only</a>
    <span class="hint">date &amp; clock tick live; edit <code>geometry.json</code> (incl. the <code>widget</code> section)</span>
  </div>
  <div id="err"></div>
  <canvas id="cv" width="680" height="632"></canvas>
  <div class="hint" id="meta">loaded -</div>

<script src="sleep-block.js"></script>
<script>
'use strict';
const JSON_URL = 'geometry.json';
const POLL_MS = 600;
const CLOCK_MS = 1000;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
const errEl = document.getElementById('err');
const metaEl = document.getElementById('meta');
const zoomSel = document.getElementById('zoom');
const guidesChk = document.getElementById('guides');
const plainChk = document.getElementById('plain');
const reloadBtn = document.getElementById('reload');

const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

let lastRaw = null, lastGeom = null, lastLoad = null;

function setStatus(ok, msg) {
  statusEl.classList.toggle('err', !ok);
  statusText.textContent = msg;
}
function showError(msg) {
  errEl.textContent = msg;
  errEl.style.display = msg ? 'block' : 'none';
}

function setLS(em, size) {
  try { ctx.letterSpacing = ((em || 0) * size).toFixed(2) + 'px'; } catch (_) {}
}

function drawCard(g) {
  const w = g.widget;
  const c = w.card;
  ctx.beginPath();
  const r = Math.min(c.radius, c.w / 2, c.h / 2);
  ctx.moveTo(c.inset + r, c.inset);
  ctx.arcTo(c.w - c.inset, c.inset, c.w - c.inset, c.h - c.inset, r);
  ctx.arcTo(c.w - c.inset, c.h - c.inset, c.inset, c.h - c.inset, r);
  ctx.arcTo(c.inset, c.h - c.inset, c.inset, c.inset, r);
  ctx.arcTo(c.inset, c.inset, c.w - c.inset, c.inset, r);
  ctx.closePath();
  ctx.fillStyle = c.bg;
  ctx.fill();
  if (c.strokeWidth > 0) {
    ctx.strokeStyle = c.stroke;
    ctx.lineWidth = c.strokeWidth;
    ctx.stroke();
  }
}

function drawDate(g) {
  const w = g.widget, d = w.date;
  const now = new Date();
  const weekday = WEEKDAYS[now.getDay()];
  const day = String(now.getDate());
  const month = MONTHS[now.getMonth()];
  ctx.textBaseline = 'alphabetic';
  ctx.font = d.weight + ' ' + d.size + 'px "Segoe UI", Roboto, sans-serif';
  const parts = [
    { text: weekday + ' ', color: d.muted },
    { text: day, color: d.day },
    { text: ' ' + month, color: d.muted },
  ];
  let total = 0;
  for (const p of parts) total += ctx.measureText(p.text).width;
  let x = w.card.w / 2 - total / 2;
  for (const p of parts) {
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, x, d.y);
    x += ctx.measureText(p.text).width;
  }
}

function drawClock(g) {
  const w = g.widget, c = w.clock;
  const now = new Date();
  const h12 = now.getHours() % 12 === 0 ? 12 : now.getHours() % 12;
  const hh = String(h12).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  const ampm = now.getHours() >= 12 ? 'pm' : 'am';
  ctx.textBaseline = 'alphabetic';
  const main = () => c.weight + ' ' + c.size + 'px "Segoe UI", Roboto, sans-serif';
  const sub = () => '400 ' + c.subSize + 'px "Segoe UI", Roboto, sans-serif';
  const segs = [
    { text: hh, color: c.hours, font: main() },
    { text: ':', color: c.colonMinutes, font: main() },
    { text: mm, color: c.colonMinutes, font: main() },
    { text: ' ' + ss, color: c.seconds, font: sub(), gap: c.gapBeforeSub },
    { text: ' ' + ampm, color: c.ampm, font: sub(), gap: c.gapBetweenSub },
  ];
  let total = 0;
  for (const p of segs) total += ctx.measureText(p.text).width;
  let x = w.card.w / 2 - total / 2;
  for (const p of segs) {
    ctx.font = p.font;
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, x, c.y);
    x += ctx.measureText(p.text).width;
  }
}

function drawStats(g) {
  const w = g.widget, s = w.stats;
  ctx.textBaseline = 'alphabetic';
  // dividers
  ctx.strokeStyle = s.dividerColor;
  ctx.lineWidth = s.dividerWidth;
  for (const x of s.dividerXs) {
    ctx.beginPath(); ctx.moveTo(x, s.dividerY0); ctx.lineTo(x, s.dividerY1); ctx.stroke();
  }
  // values
  ctx.font = s.valueWeight + ' ' + s.valueSize + 'px "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = s.alarmColor; ctx.fillText(s.alarmText, s.alarmX, s.valueY);
  ctx.fillStyle = s.valueColor; ctx.fillText(s.battText, s.battX, s.valueY);
  ctx.fillStyle = s.valueColor; ctx.fillText(s.tempText, s.tempX, s.valueY);
  // labels
  ctx.font = s.labelWeight + ' ' + s.labelSize + 'px "Segoe UI", Roboto, sans-serif';
  setLS(s.labelSpacing / s.labelSize, s.labelSize);
  ctx.fillStyle = s.labelColor;
  ['ALARM', 'BATT', 'TEMP'].forEach((label, i) => {
    const x = [s.alarmX, s.battX, s.tempX][i];
    ctx.fillText(label, x, s.labelY);
  });
  setLS(0, 0);
  ctx.textAlign = 'left';
}

function render(g) {
  const w = g.widget;
  if (!w) throw new Error('geometry.json is missing the "widget" section');
  const zoom = parseFloat(zoomSel.value);
  cv.width = Math.round(w.card.w * zoom);
  cv.height = Math.round(w.card.h * zoom);
  ctx.setTransform(zoom, 0, 0, zoom, 0, 0);
  ctx.clearRect(0, 0, w.card.w, w.card.h);
  drawCard(g);
  drawDate(g);
  drawClock(g);
  ctx.save();
  ctx.translate(w.block.x, w.block.y);
  if (w.block.scale && w.block.scale !== 1) ctx.scale(w.block.scale, w.block.scale);
  SleepBlock.render(ctx, g, { guides: guidesChk.checked });
  ctx.restore();
  drawStats(g);
  if (guidesChk.checked) {
    ctx.strokeStyle = 'rgba(0,255,255,0.35)';
    ctx.lineWidth = 0.4;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(w.card.w / 2, 0); ctx.lineTo(w.card.w / 2, w.card.h); ctx.stroke();
    ctx.setLineDash([]);
  }
}

async function poll() {
  let raw = null;
  try {
    const res = await fetch(JSON_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' fetching ' + JSON_URL);
    raw = await res.text();
  } catch (e) {
    setStatus(false, 'offline');
    showError('Could not fetch ' + JSON_URL + '\n' + e.message +
              '\n(Is the static server still running? If JSON is mid-edit and invalid, the last good frame stays on screen.)');
    return;
  }
  if (raw === lastRaw && lastGeom) { setStatus(true, 'live (no changes)'); return; }
  try {
    const g = JSON.parse(raw);
    lastGeom = g; lastRaw = raw; lastLoad = new Date();
    showError(null);
    setStatus(true, 'live');
    metaEl.textContent = 'rendered ' + lastLoad.toLocaleTimeString();
    render(g);
  } catch (e) {
    setStatus(false, 'bad JSON');
    showError('geometry.json is not valid JSON - last good frame is still shown.\n' + e.message);
  }
}

reloadBtn.addEventListener('click', () => { lastRaw = null; poll(); });
zoomSel.addEventListener('change', () => lastGeom && render(lastGeom));
guidesChk.addEventListener('change', () => lastGeom && render(lastGeom));
plainChk.addEventListener('change', () => { document.body.classList.toggle('plain', plainChk.checked); });
poll();
setInterval(poll, POLL_MS);
setInterval(() => lastGeom && render(lastGeom), CLOCK_MS);
</script>
</body>
</html>
