services:
  - type: web
    name: meridian-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meridian-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: meridian-db
    databaseName: meridian
    region: singapore
    plan: free
