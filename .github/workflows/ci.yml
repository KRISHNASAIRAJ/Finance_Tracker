name: CI — Smoke Tests + OTA Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 1 — Checkout
        uses: actions/checkout@v4

      - name: 2 — Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 3 — Install dependencies
        run: npm ci

      - name: 4 — TypeScript check
        run: npx tsc --noEmit

      - name: 5 — ESLint check
        run: npx eslint . --ext .ts,.tsx --max-warnings 50

      - name: 6 — Expo Doctor
        run: npx expo-doctor

      - name: 7 — Run Jest tests
        run: npx jest --passWithNoTests --forceExit
        continue-on-error: true

  deploy:
    name: OTA Deploy
    needs: smoke
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Push OTA Update
        run: eas update --branch production --auto --non-interactive
