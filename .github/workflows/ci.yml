name: CI — Smoke Tests + OTA Deploy

on:
  push:
    branches: [main, "v*"]
  pull_request:
    branches: [main, "v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 1 — Checkout
        uses: actions/checkout@v4

      - name: 2 — Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 3 — Install dependencies
        run: npm ci

      - name: 4 — TypeScript check
        run: npx tsc --noEmit

      - name: 5 — ESLint check
        # Threshold covers existing warning debt (no-console/no-empty in src/).
        # Tighten as warnings are cleaned up.
        run: npx eslint . --ext .ts,.tsx --max-warnings 200

      - name: 6 — Expo Doctor
        run: npx expo-doctor

      - name: 7 — Run Jest tests
        run: npx jest --passWithNoTests --forceExit
        continue-on-error: true

  deno:
    name: Edge Functions (fmt + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.0"

      - name: Deno format + lint
        run: |
          deno fmt --check supabase/functions
          deno lint supabase/functions

  db:
    name: Migration Collision Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for duplicate migration timestamps
        run: |
          DUPES=$(ls supabase/migrations/*.sql 2>/dev/null | sed 's|.*/||' | grep -oP '^\d+' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "::error::Duplicate migration timestamps found: $DUPES"
            exit 1
          fi
          echo "No duplicate migration timestamps found."

  ota-check:
    name: OTA Check
    needs: [smoke, deno, db]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check EXPO_TOKEN
        id: check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "EXPO_TOKEN not set — OTA update will be skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: OTA Deploy
    needs: [smoke, deno, db, ota-check]
    if: needs.ota-check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Push OTA Update
        run: eas update --branch production --auto --non-interactive
