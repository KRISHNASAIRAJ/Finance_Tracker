name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-env:
    name: 0 — Validate Env
    runs-on: ubuntu-latest
    steps:
      - name: Check EXPO_PUBLIC secrets
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_KITE_API_KEY: ${{ secrets.EXPO_PUBLIC_KITE_API_KEY }}
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL"      || { echo "::error::EXPO_PUBLIC_SUPABASE_URL missing"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo "::error::EXPO_PUBLIC_SUPABASE_ANON_KEY missing"; exit 1; }
          test -n "$EXPO_PUBLIC_KITE_API_KEY"      || { echo "::error::EXPO_PUBLIC_KITE_API_KEY missing"; exit 1; }

  migrate-db:
    name: 1 — Database Migration
    needs: [validate-env]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Missing Supabase secrets. Add SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_ID to repo settings → Secrets."
            exit 1
          fi

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --include-all

  smoke:
    name: 2 — Smoke Tests
    needs: [validate-env]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint check
        run: npx eslint . --ext .ts,.tsx --max-warnings 80

      - name: Expo Doctor
        run: npx expo-doctor
        continue-on-error: true

  tests:
    name: 3 — Unit & Integration Tests
    needs: [validate-env]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests
        run: npm run test:unit

  e2e:
    name: 4 — E2E Tests
    needs: [validate-env]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        run: npm run test:e2e

  build-apk:
    name: 5 — Build APK
    needs: [validate-env, migrate-db, smoke, tests, e2e]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Validate EXPO_PUBLIC env
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_KITE_API_KEY: ${{ secrets.EXPO_PUBLIC_KITE_API_KEY }}
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL"      || { echo "::error::EXPO_PUBLIC_SUPABASE_URL is empty"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo "::error::EXPO_PUBLIC_SUPABASE_ANON_KEY is empty"; exit 1; }
          test -n "$EXPO_PUBLIC_KITE_API_KEY"      || { echo "::error::EXPO_PUBLIC_KITE_API_KEY is empty"; exit 1; }

      - name: Build release APK
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_KITE_API_KEY: ${{ secrets.EXPO_PUBLIC_KITE_API_KEY }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }} \
            --no-daemon

      - name: Verify env inlined in APK
        run: |
          unzip -p android/app/build/outputs/apk/release/app-release.apk assets/index.android.bundle \
            | grep -q "https://rkmouoglorsnijmemmcd.supabase.co" \
            || { echo "::error::Supabase URL not found in JS bundle — env not inlined"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
